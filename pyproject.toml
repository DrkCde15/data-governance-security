[project]
name = "data-governance-security"
version = "0.1.0"
description = "Governança e segurança de dados: RBAC, classificação, auditoria e catálogo mínimo, simulados localmente (SQLite)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["python-dotenv>=1.0"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
